name: Deploy Jessieville to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and upload static site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@11.25.0
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.SITE_URL && '/' || steps.pages.outputs.base_path }}
          ASTRO_TELEMETRY_DISABLED: 1
      - name: Verify migrated content and links
        run: pnpm run verify
        env:
          BASE_PATH: ${{ vars.SITE_URL && '/' || steps.pages.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
